name: omemo_dart
description: An XMPP library independent OMEMO library
version: 0.6.0
homepage: https://github.com/PapaTutuWawa/omemo_dart
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  collection: ^1.18.0
  convert: ^3.1.2
  crypto: ^3.0.6
  cryptography: ^2.7.0
  hex: ^0.2.0
  # Native PQXDH + SessionCipher + SPQR (AGPL-3.0). Path fork enables
  # ML-KEM-1024 (0x0A) for monocles OMEMO2.
  libsignal:
    path: ../libsignal_dart
  # Classical Axolotl / X3DH helpers (Dart).
  libsignal_protocol_dart: ^0.8.2
  logging: ^1.2.0
  meta: ^1.15.0
  moxlib:
    path: ../moxlib
  path: ^1.9.0
  pinenacl: ^0.6.0
  synchronized: ^3.3.0+3

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.8
  very_good_analysis: ^6.0.0
